
name: Test Build KAC Communicator Academy

on:
  push:
    branches:
      - fitur-database-cloud
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode aplikasi
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi
        run: npm install

      - name: Uji build aplikasi
        run: npm run build
